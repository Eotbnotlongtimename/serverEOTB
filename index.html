<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empire Of The Blocks Frozen Bones</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a3a5c 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            text-align: center;
            border: 1px solid rgba(100, 150, 200, 0.3);
        }

        .header h1 {
            font-size: 3em;
            background: linear-gradient(135deg, #4a9eff 0%, #1a5a9e 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }

        .header p {
            color: #88aadd;
            font-size: 1.1em;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        .news-section {
            background: rgba(15, 20, 30, 0.9);
            backdrop-filter: blur(5px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 1px solid rgba(100, 150, 200, 0.2);
        }

        .video-section {
            background: rgba(15, 20, 30, 0.9);
            backdrop-filter: blur(5px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 1px solid rgba(100, 150, 200, 0.2);
        }

        .section-title {
            font-size: 2em;
            color: #4a9eff;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #4a9eff;
            display: inline-block;
        }

        .news-card {
            background: rgba(25, 35, 50, 0.8);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
            border-left: 4px solid #4a9eff;
        }

        .news-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            background: rgba(35, 45, 60, 0.9);
        }

        .news-date {
            color: #4a9eff;
            font-size: 0.9em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .news-title {
            font-size: 1.5em;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .news-description {
            color: #bbccdd;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .news-tag {
            display: inline-block;
            background: rgba(74, 158, 255, 0.2);
            color: #4a9eff;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
        }

        .video-card {
            background: rgba(25, 35, 50, 0.8);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid rgba(74, 158, 255, 0.2);
        }

        .video-title {
            font-size: 1.2em;
            color: #ffffff;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-description {
            color: #bbccdd;
            font-size: 0.9em;
            line-height: 1.5;
        }

        @media (max-width: 768px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2em;
            }
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .news-card, .video-card {
            animation: fadeIn 0.5s ease-out;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Новости</h1>
            <p>Жизнь сервера и видосики, по типу новостных сводок</p>
        </div>

        <div class="content-grid">
            <div class="news-section">
                <h2 class="section-title">Последние новости</h2>
                <div id="news-container"></div>
            </div>

            <div class="video-section">
                <h2 class="section-title">🎬кадрики с сервера</h2>
                <div id="videos-container"></div>
            </div>
        </div>
    </div>

    <script>
   //новости сюды хуярить
        
        const newsData = [
            {
                date: "2026-05-07",
                title: "Запуск нового медиапортала!",
                description: "Приветствуем на сайте новостей проекта Empire of the blocks FROZEN BONES",
                tag: "Главное"
            },
            {
                date: "2026-05-06",
                title: "обновления",
                description: "тут я буду писать про обновления сборки, контента, и техработах, не пропустите",
                tag: "Техчасть"
            },
            {
                date: "2026-05-05",
                title: "сюжет",
                description: "Новости по сюжету в качестве текста а не видео",
                tag: "Сюжет"
            },
            {
                date: "2026-05-04",
                title: "жизнь разработчиков",
                description: "всякие интересности из жизни разрабов",
                tag: "Дизайн"
            }
        ];

//а видосики сюды
        const videosData = [
            {
               title: "Новости НА сервере",
                url: "https://www.youtube.com/embed/dQw4w9WgXcQ",
                description: "внимание ссылки являються плейсхолдерами, пока что они видут на рикролл видео (живите с этой информацией)"
            },
            {
               title: "Новости в разроботке",
                url: "https://www.youtube.com/embed/dQw4w9WgXcQ",
                description: "внимание ссылки являються плейсхолдерами, пока что они видут на рикролл видео (живите с этой информацией)"
        ];

//cюды не лезь падла ебанная
        
        function renderNews() {
            const container = document.getElementById('news-container');
            if (!container) return;
            
            container.innerHTML = '';
            newsData.forEach(news => {
                const newsCard = document.createElement('div');
                newsCard.className = 'news-card';
                newsCard.innerHTML = `
                    <div class="news-date">📅 ${news.date}</div>
                    <div class="news-title">${escapeHtml(news.title)}</div>
                    <div class="news-description">${escapeHtml(news.description)}</div>
                    <span class="news-tag">🏷️ ${escapeHtml(news.tag)}</span>
                `;
                container.appendChild(newsCard);
            });
        }
        
        function renderVideos() {
            const container = document.getElementById('videos-container');
            if (!container) return;
            
            container.innerHTML = '';
            videosData.forEach(video => {
                const videoCard = document.createElement('div');
                videoCard.className = 'video-card';
                videoCard.innerHTML = `
                    <div class="video-title">🎬 ${escapeHtml(video.title)}</div>
                    <div class="video-wrapper">
                        <iframe src="${video.url}" allowfullscreen></iframe>
                    </div>
                    <div class="video-description">${escapeHtml(video.description)}</div>
                `;
                container.appendChild(videoCard);
            });
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        renderNews();
        renderVideos();
    </script>
</body>
</html>
